name: Tests

# Runs on every push to main and on PRs.  PRs from OWNER / MEMBER /
# COLLABORATOR auto-run; PRs from outside contributors require a
# maintainer to add the `ci-approved` label before tests will run.
# Re-running after the label is added is automatic (the `labeled`
# trigger re-evaluates the gate).
#
# Two tiers.  PRs run the fast tier: every test not marked `slow`, in
# parallel (a few minutes).  Pushes to main, the nightly run and a manual
# run add the ~30 slow tests (large round trips, octree conversions).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 6 * * *'   # nightly full tier on main
  workflow_dispatch:

# Cancel superseded runs on the same ref (avoids piling up jobs when a
# PR is force-pushed several times in a row).
env:
  # zarr-octree commit the octree tests run against (bump with zarr-octree).
  ZARR_OCTREE_REF: b4c389a4e5154e1925c9cef34b860d7cfb4c487a

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Auto-pass for push events and trusted PR authors.  Outside
    # contributors wait for a maintainer to apply the `ci-approved`
    # label, at which point the `labeled` event re-triggers this
    # workflow and the gate passes.
    name: Approval gate
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      contains(github.event.pull_request.labels.*.name, 'ci-approved')
    steps:
      - name: Record gate decision
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Author association: ${{ github.event.pull_request.author_association }}"
          echo "Labels: ${{ join(github.event.pull_request.labels.*.name, ', ') }}"

  lint:
    # ruff over the package and the tests; config in pyproject.toml.
    # Pinned so a ruff release cannot fail CI on code nobody touched
    # (same pin as zarr-octree).
    name: ruff
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: ruff check
        run: uvx ruff@0.17.5 check zarr_vectors tests

  test:
    name: pytest (py${{ matrix.python-version }})
    needs: gate
    runs-on: ubuntu-latest
    # A hung test fails the job instead of holding it for GitHub's 6 h limit.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      # Installs uv and caches the resolved environment keyed on the
      # contents of uv.lock.  The cache restores on a hit, so cold
      # runs are the only ones that pay the install cost.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (frozen, all extras + dev)
        run: uv sync --frozen --extra all --extra dev

      - name: Install zarr-octree (octree sharding tests)
        # Not on PyPI yet, so not a declared extra: pinned here by commit.
        # It needs Python >= 3.12, so the 3.11 job skips the octree tests.
        if: matrix.python-version != '3.11'
        run: >-
          uv pip install
          "zarr-octree @ git+https://github.com/Andrew-Keenlyside/zarr-octree@${ZARR_OCTREE_REF}"

      - name: Check schema artefacts are in sync
        # The JSON Schema and reference.md are GENERATED from the LinkML
        # source. Nothing regenerated them in CI, which is how they drifted
        # far enough to omit fields the runtime was already writing.
        run: uv run python schema/regen.py --check

      - name: Run tests
        # -n auto: one worker per core.  --timeout: per test, so one hang
        # names itself.  --durations: the slowest tests, to spot new ones
        # that belong under @pytest.mark.slow.
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'not slow' || '' }}
          # Where zarr-octree is installed, its tests must run, not skip.
          ZV_REQUIRE_OCTREE: ${{ matrix.python-version != '3.11' && '1' || '' }}
        run: >-
          uv run pytest tests/ --ignore=tests/integration
          -n auto --timeout=300 --durations=15 -q -rfE
          ${TIER:+-m "$TIER"}
